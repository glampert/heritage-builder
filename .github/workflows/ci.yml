name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------
  # Desktop: build the game + run all unit/integration tests.
  # ----------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # glfw (built from source): X11 + Wayland headers. kira/cpal: ALSA.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libgl1-mesa-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          # The codebase isn't warning-free yet; don't fail the build on warnings.
          build-warnings: warn

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # ----------------------------------------------------------
  # Scenarios: run the game's automation scripts (--script) on a
  # virtual display, check determinism, keep the screenshots.
  # ----------------------------------------------------------
  scenarios:
    name: Scenarios (Linux, Xvfb)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          # Build deps as in the desktop job, plus Xvfb and Mesa's software OpenGL to run the game.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libgl1-mesa-dev libgl1-mesa-dri xvfb

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          build-warnings: warn

      - name: Build (release)
        run: cargo build --release -p HeritageBuilder

      # Each script prints a JSON line per command and exits 1 if any fails. Logs go to stderr.
      - name: Run scenarios
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p logs
          for scenario in smoke ui_new_game ui_build; do
            echo "::group::$scenario"
            xvfb-run -a -s "-screen 0 1920x1080x24" \
              target/release/HeritageBuilder --script "crates/game/tests/scenarios/$scenario.jsonl" \
              2> "logs/$scenario.log"
            echo "::endgroup::"
          done

      # The same seed must give the same game: both runs print the same lines and write the same save.
      - name: Determinism
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          for run in 1 2; do
            xvfb-run -a -s "-screen 0 1920x1080x24" \
              target/release/HeritageBuilder --seed 7 --script crates/game/tests/scenarios/determinism.jsonl \
              > "logs/determinism-$run.jsonl" 2> "logs/determinism-$run.log"
            cp saves/determinism.json "logs/determinism-$run.json"
          done
          grep '"session.checksum"' logs/determinism-1.jsonl
          diff logs/determinism-1.jsonl logs/determinism-2.jsonl
          cmp logs/determinism-1.json logs/determinism-2.json

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarios
          path: |
            out/
            logs/

  # ----------------------------------------------------------
  # Web: build the wasm32 target via the web-builder tool.
  # ----------------------------------------------------------
  web:
    name: Web (wasm32)
    runs-on: ubuntu-latest
    env:
      # wasi-sdk provides clang++/llvm-ar + WASI sysroot to cross-compile imgui-sys.
      # Headers in wasi-sdk 33+ refuse non-WASI targets, so stay on 32 for now.
      WASI_SDK_VERSION: "32"
      BINARYEN_VERSION: "133"

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          build-warnings: warn

      - name: Install wasi-sdk
        run: |
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"

      - name: Install wasm-opt (binaryen)
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      # wasm-bindgen-cli must exactly match the wasm-bindgen crate version that
      # Cargo resolves (Cargo.lock isn't committed), so look it up first.
      - name: Resolve wasm-bindgen version
        id: wasm-bindgen
        run: |
          cargo generate-lockfile
          version=$(cargo pkgid wasm-bindgen | sed 's/.*@//')
          echo "Resolved wasm-bindgen $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Build web (release)
        run: cargo run -p web-builder -- release

      - name: Check build outputs
        run: |
          ls -lh web/pkg
          test -s web/pkg/HeritageBuilder.js
          test -s web/pkg/HeritageBuilder_bg.wasm
          # The web runner only preloads files listed in the manifest, so flag a stale one.
          # Warning only for now; switch to a hard failure once the manifest is in sync.
          git diff --exit-code -- web/asset_manifest.json \
            || echo "::warning file=web/asset_manifest.json::asset_manifest.json is out of date with assets/. Rebuild the web target and commit the updated manifest."

      # Drives the release build in headless Chromium through window.heritage.exec, rendering
      # WebGPU on the CPU (SwiftShader). See crates/tools/web_smoke/smoke.py.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Web smoke test
        run: python3 crates/tools/web_smoke/smoke.py --swiftshader --timeout 240

      - name: Upload web smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke
          path: out/web/"
