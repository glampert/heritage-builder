[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/engine",
    "crates/game",
    "crates/launcher",
    "crates/proc_macros",
    "crates/tools/bundler",
    "crates/tools/hb-ctl",
    "crates/tools/web-builder",
]

# -------------------------
#   Ignored Clippy lints
# -------------------------

[workspace.lints.clippy]
new_without_default = "allow"
collapsible_if = "allow"

# -------------------------
#   Dev profile overrides
# -------------------------

# PNG encoding and decoding: screenshots and texture loading. Unoptimized,
# encoding one full-screen screenshot takes seconds in a debug build.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
